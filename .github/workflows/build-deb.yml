name: Build SmartDialSIM RootHide DEB

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bash \
            curl \
            sudo \
            git \
            make \
            build-essential \
            fakeroot \
            rsync \
            perl \
            zip \
            unzip \
            libxml2 \
            python3 \
            dpkg

      - name: Install RootHide Theos
        run: |
          export THEOS="$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

          bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"

          echo "=== THEOS ==="
          ls -la "$THEOS"

          echo "=== SDKs ==="
          ls -la "$THEOS/sdks" || true

      - name: Verify project
        run: |
          echo "=== Project files ==="
          ls -la

          echo "=== Makefile ==="
          cat Makefile

          if [ -f Scripts/VERIFY_STAGE4.sh ]; then
            chmod +x Scripts/VERIFY_STAGE4.sh
            ./Scripts/VERIFY_STAGE4.sh
          fi

      - name: Build RootHide DEB
        run: |
          export THEOS="$HOME/theos"

          make clean
          make package FINALPACKAGE=1 -j$(nproc)

      - name: Show generated packages
        run: |
          echo "=== DEB files ==="
          find packages -type f -name "*.deb" -print

          echo "=== Package info ==="
          for deb in packages/*.deb; do
            echo "--------------------------------"
            dpkg-deb -I "$deb"
          done

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: SmartDialSIM-DEB
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 30
